name: phase0-gate

# Roadmap v3 Phase 0 deliverable "최소 CI": prove the headless CPU frame path still works
# from a clean checkout, on every push.
#
# The simulator SHA and the package versions are both derived from env-lock-candidate.txt
# at run time rather than written out here. docs/phase0_env.md argues against a submodule
# precisely because a second copy of the SHA can drift from the lock; hardcoding it in this
# file would make the same mistake.
#
# torch and stable_baselines3 are dropped from the install set: `dronevla.profile_env`
# never imports torch -- its report records `torch_imported: false` -- and torch is by far
# the heaviest dependency. Phase 1 adds a separate training job that needs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frame-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read the lock
        id: lock
        run: |
          set -euo pipefail
          sha=$(sed -n 's/.*gym-pybullet-drones\.git@\([0-9a-f]\{40\}\).*/\1/p' \
                env-lock-candidate.txt)
          test -n "$sha" || { echo "no pinned SHA in env-lock-candidate.txt"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Everything except the editable clone and the two training-only packages.
          grep -v '^-e ' env-lock-candidate.txt \
            | grep -v '^torch==' \
            | grep -v '^stable_baselines3==' > ci-requirements.txt
          echo "pinned simulator: $sha"
          echo "--- ci-requirements.txt ---"
          cat ci-requirements.txt

      - name: Install build tooling for pybullet
        # pybullet 3.2.7 publishes no cp312 wheel, so pip builds it from source here, the
        # same way the local environment was built.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clone the pinned simulator
        run: |
          set -euo pipefail
          git clone --filter=blob:none \
            https://github.com/learnsyslab/gym-pybullet-drones.git \
            third_party/gym-pybullet-drones
          git -C third_party/gym-pybullet-drones checkout --detach '${{ steps.lock.outputs.sha }}'
          test "$(git -C third_party/gym-pybullet-drones rev-parse HEAD)" \
             = '${{ steps.lock.outputs.sha }}'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          # numpy must be importable while pybullet compiles, or the extension is built
          # without its numpy path and getCameraImage returns lists instead of ndarrays.
          # Build isolation would hide numpy from that build, hence --no-build-isolation
          # for pybullet specifically.
          pip install "$(grep '^numpy==' env-lock-candidate.txt)"
          pip install --no-build-isolation "$(grep '^pybullet==' env-lock-candidate.txt)"
          pip install -r ci-requirements.txt
          pip install --no-deps -e third_party/gym-pybullet-drones
          pip check

      - name: Verification gates from docs/phase0_env.md
        run: |
          python - <<'PY'
          import sys
          import pybullet
          print("pybullet", pybullet.getAPIVersion(),
                "isNumpyEnabled()", pybullet.isNumpyEnabled())
          if pybullet.isNumpyEnabled() != 1:
              sys.exit("pybullet was built without numpy support; getCameraImage would "
                       "return Python lists and every render timing would be wrong")
          print("torch imported:", "torch" in sys.modules)
          PY

      - name: Phase 0 gate
        run: bash scripts/ci_smoke.sh

      - name: Phase 1 tests (action contract, env API, one fixture per outcome)
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-report
          path: results/env_profile_ci/env.json
          if-no-files-found: warn
