name: phase0-gate

# Roadmap v3 Phase 0 deliverable "최소 CI": prove the headless CPU frame path still works
# from a clean checkout, on every push.
#
# Deliberately does NOT install torch. `dronevla.profile_env` never imports it -- the
# report records `torch_imported: false` -- and torch is by far the heaviest dependency,
# so leaving it out keeps this job short. Phase 1 adds a separate training job that needs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  frame-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Must match env-lock-candidate.txt. The lock pins this clone by SHA rather than
      # carrying it as a submodule; see docs/phase0_env.md "Repo layout decisions".
      GYM_PYBULLET_DRONES_SHA: 7ebad1ecabd28a7000add2d05f888aa2e837c2cc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling for pybullet
        # pybullet 3.2.7 publishes no cp312 wheel, so pip builds it from source here, the
        # same way the local environment was built.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Clone the pinned simulator
        run: |
          git clone --filter=blob:none https://github.com/learnsyslab/gym-pybullet-drones.git \
              third_party/gym-pybullet-drones
          git -C third_party/gym-pybullet-drones checkout --detach "$GYM_PYBULLET_DRONES_SHA"
          git -C third_party/gym-pybullet-drones rev-parse HEAD

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            'numpy==2.5.3' 'pillow==12.3.0' 'pybullet==3.2.7' 'gymnasium==1.3.0' \
            'scipy==1.18.1' 'transforms3d==0.4.2' 'matplotlib==3.11.2' 'pytest==9.1.1'
          pip install --no-deps -e third_party/gym-pybullet-drones
          python -c "import pybullet; print('pybullet numpy enabled:', pybullet.isNumpyEnabled())"

      - name: Phase 0 gate
        run: bash scripts/ci_smoke.sh

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-gate-report
          path: results/env_profile_ci/env.json
          if-no-files-found: warn
